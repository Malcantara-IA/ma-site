[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


# Preserve links to the former page while consolidating the content.
[[redirects]]
  from = "/atuacao/recuperacao-judicial"
  to = "/atuacao/reestruturacao-de-dividas/"
  status = 301
  force = true

[[redirects]]
  from = "/atuacao/recuperacao-judicial/"
  to = "/atuacao/reestruturacao-de-dividas/"
  status = 301
  force = true
